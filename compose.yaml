name: skycast

services:
  prefect-server:
    image: prefecthq/prefect:3.9.4-python3.14
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_HOME: /prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: http://127.0.0.1:${PREFECT_PORT:-4200}/api
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect-data:/prefect
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    profiles:
      - storage
    entrypoint:
      - sh
      - -c
      - |
        test -n "$$SKYCAST_S3_ACCESS_KEY" && test -n "$$SKYCAST_S3_SECRET_KEY" || {
          echo "Missing SKYCAST_S3_ACCESS_KEY or SKYCAST_S3_SECRET_KEY" >&2
          exit 1
        }
        umask 077
        printf '{"identities":[{"name":"skycast","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$SKYCAST_S3_ACCESS_KEY" "$$SKYCAST_S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -volume.max=5 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      SKYCAST_S3_ACCESS_KEY: ${SKYCAST_S3_ACCESS_KEY:-}
      SKYCAST_S3_SECRET_KEY: ${SKYCAST_S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${SEAWEEDFS_PORT:-8333}:8333"
    volumes:
      - ${SKYCAST_OBJECT_DIR:-./object-store}:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  skycast-scheduler:
    build: .
    image: ${SKYCAST_IMAGE:-skycast-scheduler:local}
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      SKYCAST_S3_ENDPOINT: http://seaweedfs:8333
      SKYCAST_S3_ACCESS_KEY: ${SKYCAST_S3_ACCESS_KEY:-}
      SKYCAST_S3_SECRET_KEY: ${SKYCAST_S3_SECRET_KEY:-}
    volumes:
      - ${SKYCAST_DATA_DIR:-./data}:/app/data
      - ${SKYCAST_CONFIG_DIR:-./config}:/app/config:ro
    depends_on:
      prefect-server:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://prefect-server:4200/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  prefect-data:
