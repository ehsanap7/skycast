name: skycast

services:
  prefect-server:
    image: prefecthq/prefect:3.9.4-python3.14
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_HOME: /prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: http://127.0.0.1:${PREFECT_PORT:-4200}/api
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect-data:/prefect
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  skycast-scheduler:
    build: .
    image: skycast-scheduler:local
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - ${SKYCAST_DATA_DIR:-./data}:/app/data
      - ./config:/app/config:ro
    depends_on:
      prefect-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://prefect-server:4200/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  prefect-data:
