active_city: toronto

storage:
  backend: local
  root: data

forecast:
  horizon_days: 7

gold:
  max_fill_hours: 3
  lag_days: [1, 2, 3, 7, 14]
  rolling_days: [3, 7, 14, 30]

ingestion:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  archive_model: era5
  recent_url: https://api.open-meteo.com/v1/forecast
  recent_forecast_days: 1
  max_past_days: 92
  timeout_seconds: 60

schedule:
  recent_cron: "10 */4 * * *"
  archive_cron: "40 6 * * *"
  retries: 3
  retry_base_seconds: 30
